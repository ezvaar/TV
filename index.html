  .main {

    flex-shrink: 0;

    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .group-header:hover { color: var(--accent); }
  .channel {
    padding: 8px 14px 8px 20px;
    cursor: pointer;
    font-size: 0.875rem;
    border-left: 3px solid transparent;
    transition: background 0.12s;
  }
  .channel:hover { background: var(--hover); }
  .channel.active {
    background: var(--active);
    border-left-color: var(--accent);
    color: var(--accent-hover);
  }
  .channel .type {
    font-size: 0.68rem;
    color: var(--muted);
    margin-left: 5px;
  }
  .player-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #000;
    position: relative;
  }
  #video, #audio {
    width: 100%;
    height: 100%;
    background: #000;
  }
  #audio { display: none; }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 14px;
    pointer-events: none;

  .placeholder .big-logo {
    width: 72px; height: 72px;

    color: #0b0d11;
    font-size: 2.4rem;
    font-weight: 900;
    opacity: 0.85;
  }
  .status {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: rgba(0,0,0,0.75);
    padding: 5px 11px;
    border-radius: 6px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .status.error { color: #f87171; }
  .status.ok { color: var(--accent); }
  .collapsed .channels { display: none; }
  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 7px 18px;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;

  @media (max-width: 700px) {

const video = document.getElementById('video');
const audio = document.getElementById('audio');
const placeholder = document.getElementById('placeholder');
const nowPlaying = document.getElementById('nowPlaying');
const statusEl = document.getElementById('status');
const groupsEl = document.getElementById('groups');
const searchInput = document.getElementById('search');
const countInfo = document.getElementById('countInfo');

let hls = null;
let currentUrl = null;
let totalChannels = 0;

function isAudioUrl(url) {
  const u = url.toLowerCase();
  return u.endsWith('.mp3') || u.endsWith('.aac') || u.includes('/aac') ||
         u.includes('streamtheworld') || u.includes('iono.fm') ||
         u.includes('streamguys') || u.includes('bbcmedia') ||
         u.includes('zeno.fm') || u.includes('famcast') ||
         u.includes('radio.co') || u.includes('icecast');
}

function setStatus(msg, type='') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + type;
}

function stopAll() {
  if (hls) { hls.destroy(); hls = null; }
  video.pause(); video.removeAttribute('src'); video.load();
  audio.pause(); audio.removeAttribute('src'); audio.load();
  video.style.display = 'none';
  audio.style.display = 'none';
}

function playChannel(name, url) {
  if (url === currentUrl) return;
  currentUrl = url;
  stopAll();
  placeholder.style.display = 'none';
  nowPlaying.innerHTML = '<strong>' + name + '</strong>';
  setStatus('Loading…');

  const isAudio = isAudioUrl(url);

  if (isAudio) {
    audio.style.display = 'block';
    audio.src = url;
    audio.play().then(() => setStatus('Playing · Audio', 'ok'))
      .catch(e => setStatus('Error: ' + e.message, 'error'));
  } else {
    video.style.display = 'block';
    if (url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
      hls = new Hls({ enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().then(() => setStatus('Playing', 'ok'))
          .catch(e => setStatus('Play blocked: ' + e.message, 'error'));
      });
      hls.on(Hls.Events.ERROR, (ev, data) => {
        if (data.fatal) setStatus('Stream error', 'error');
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().then(() => setStatus('Playing', 'ok'))
        .catch(e => setStatus('Error: ' + e.message, 'error'));
    } else {
      video.src = url;
      video.play().then(() => setStatus('Playing', 'ok'))
        .catch(e => setStatus('Error: ' + e.message, 'error'));
    }
  }

  document.querySelectorAll('.channel').forEach(el => {
    el.classList.toggle('active', el.dataset.url === url);
  });
}

function renderGroups(filter = '') {
  groupsEl.innerHTML = '';
  totalChannels = 0;
  const q = filter.toLowerCase().trim();

  for (const [groupName, channels] of CHANNELS) {
    const filtered = q
      ? channels.filter(c => c.name.toLowerCase().includes(q) || groupName.toLowerCase().includes(q))
      : channels;
    if (!filtered.length) continue;
    totalChannels += filtered.length;

    const groupDiv = document.createElement('div');
    const header = document.createElement('div');
    header.className = 'group-header';
    header.textContent = groupName + ' · ' + filtered.length;
    header.onclick = () => groupDiv.classList.toggle('collapsed');
    groupDiv.appendChild(header);

    const channelsDiv = document.createElement('div');
    channelsDiv.className = 'channels';
    filtered.forEach(ch => {
      const el = document.createElement('div');
      el.className = 'channel';
      el.dataset.url = ch.url;
      el.innerHTML = ch.name + (isAudioUrl(ch.url) ? '<span class="type">♪</span>' : '');
      el.onclick = () => playChannel(ch.name, ch.url);
      channelsDiv.appendChild(el);
    });
    groupDiv.appendChild(channelsDiv);
    groupsEl.appendChild(groupDiv);
  }
  countInfo.textContent = totalChannels + ' channels';
}

searchInput.addEventListener('input', () => renderGroups(searchInput.value));
renderGroups();
</script>
